services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
            - 'auth.gtm.test:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - traefik-public
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.gtm.rule=Host(`gtm.test`) || Host(`gtm.local`) || Host(`riskmanagementv2.test`)"
            - "traefik.http.routers.gtm.entrypoints=web"
            - "traefik.http.services.gtm.loadbalancer.server.port=80"
            # HTTPS: Zertifikat liegt in ~/traefik/certs (lokale CA), siehe ~/traefik/dynamic/tls.yml
            - "traefik.http.routers.gtm-secure.rule=Host(`gtm.test`) || Host(`gtm.local`) || Host(`riskmanagementv2.test`)"
            - "traefik.http.routers.gtm-secure.entrypoints=websecure"
            - "traefik.http.routers.gtm-secure.tls=true"
            - "traefik.http.routers.gtm-secure.service=gtm"
        depends_on:
            - redis
    keycloak:
        image: quay.io/keycloak/keycloak:26.2
        command: start-dev
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: keycloak
            KC_HOSTNAME: auth.gtm.test
            KC_HOSTNAME_STRICT: 'false'
            KC_HTTP_ENABLED: 'true'
            KC_PROXY_HEADERS: xforwarded
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - './keycloak-theme/passolution:/opt/keycloak/themes/passolution'
            - './keycloak-bcrypt-provider/keycloak-bcrypt-provider.jar:/opt/keycloak/providers/keycloak-bcrypt-provider.jar'
        networks:
            - sail
            - traefik-public
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.keycloak.rule=Host(`auth.gtm.test`)"
            - "traefik.http.routers.keycloak.entrypoints=web"
            - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
    traefik-public:
        external: true
volumes:
    sail-redis:
        driver: local